name: Build Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Cache dos pacotes QEMU Termux fixados
        uses: actions/cache@v4
        with:
          path: build/qemu-termux-runtime/packages
          key: qemu-termux-1.11.2-${{ hashFiles('scripts/qemu-termux-runtime.lock.json') }}
      - name: Validar scripts de build da ROM
        run: |
          sh -n scripts/check-zyx-build-host.sh
          sh -n scripts/build-zyx-guest.sh
          sh -n scripts/check-engine-assets.sh
          python3 -m py_compile scripts/package-zyx-guest.py scripts/prepare_qemu_runtime.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 -m json.tool guest/zyx-os/device/zyx/zyx_virtual/lineage.dependencies >/dev/null
      - name: Gerar e validar recursos pt-BR
        run: |
          python3 -m py_compile app/l10n/gen.py app/l10n/keys.py app/l10n/langs/en.py app/l10n/langs/pt-BR.py
          python3 app/l10n/gen.py
          git diff --exit-code -- app/src/main/res
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Configurar assinatura estável do APK release
        env:
          KEYSTORE_B64: ${{ secrets.ZYX_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ZYX_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZYX_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZYX_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > zyx-release.jks
            cat > keystore.properties <<EOF
          storeFile=zyx-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          else
            echo "Aviso: secrets de assinatura não configurados; o APK release será unsigned." >&2
          fi
      - name: Instalar plataforma e ferramentas Android
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Preparar runtime QEMU system-mode ARM64
        run: python3 scripts/prepare_qemu_runtime.py
      - name: Validar assets do engine
        run: sh scripts/check-engine-assets.sh
      - name: Validar sintaxe da bridge JNI
        run: gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" -Inative/qemu-system native/qemu-system/zyx_qemu_jni.c
      - name: Compilar APKs ZyX
        run: bash ./gradlew --no-daemon testStandardDebugUnitTest assembleStandardDebug assembleCloneDebug assembleStandardRelease
      - name: Publicar artefatos da compilação
        uses: actions/upload-artifact@v4
        with:
          name: zyx-virtual-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/standard/debug/app-standard-debug.apk
            app/build/outputs/apk/standard/release/*.apk
          if-no-files-found: error
          retention-days: 30
