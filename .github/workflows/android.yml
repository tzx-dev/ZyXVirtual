name: Build ZyXVirtual

on:
  push:
    branches: [main, 'zyxvirtual-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar plataforma e ferramentas Android
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      - name: Configurar assinatura estável do APK release
        env:
          KEYSTORE_B64: ${{ secrets.ZYX_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ZYX_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZYX_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZYX_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > zyx-release.jks
            cat > keystore.properties <<EOF
          storeFile=zyx-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          else
            echo "Aviso: secrets de assinatura não configurados; o APK release será unsigned." >&2
          fi

      - name: Testar e compilar o APK ZyXVirtual
        run: ./gradlew --no-daemon testStandardDebugUnitTest assembleStandardDebug assembleStandardRelease

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: zyx-virtual-aemu-0.0.3-${{ github.sha }}
          path: |
            app/build/outputs/apk/standard/debug/*.apk
            app/build/outputs/apk/standard/release/*.apk
          if-no-files-found: error
          retention-days: 30
